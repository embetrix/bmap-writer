# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: integration

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get --no-install-recommends install -y bmap-tools libssl-dev libtinyxml2-dev libarchive-dev libkcapi-dev tar bzip2 gzip lz4 lzop xz-utils zstd python3 wget cppcheck

    - name: Cppcheck
      run: cppcheck --enable=all --suppress=missingIncludeSystem *.cpp

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DUSE_KERNEL_CRYPTO_API=ON

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}} --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -V -C ${{env.BUILD_TYPE}}

  deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            run_on_arch: false
          - arch: arm64
            run_on_arch: aarch64
          - arch: armhf
            run_on_arch: armv7
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build Debian package (amd64)
      if: matrix.arch == 'amd64'
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y build-essential debhelper cmake pkg-config libtinyxml2-dev libarchive-dev libkcapi-dev
        VERSION=$(git describe --tags | sed 's/^v//')
        sed -i "1s/([^)]*)/(${VERSION})/" debian/changelog
        dpkg-buildpackage -us -uc -b

    - name: Build Debian package (${{matrix.arch}})
      if: matrix.arch != 'amd64'
      uses: uraimo/run-on-arch-action@d94c13912ea685de38fccc1109385b83fd79427d # v3.0.1
      with:
        arch: ${{matrix.run_on_arch}}
        distro: ubuntu_latest
        githubToken: ${{github.token}}
        install: |
          apt-get update
          apt-get --no-install-recommends install -y build-essential debhelper cmake pkg-config libtinyxml2-dev libarchive-dev libkcapi-dev git
        run: |
          git config --global --add safe.directory /home/runner/work/bmap-writer/bmap-writer
          VERSION=$(git describe --tags | sed 's/^v//')
          sed -i "1s/([^)]*)/(${VERSION})/" debian/changelog
          dpkg-buildpackage -us -uc -b
          mv -f ../*.deb .

    - name: Move Debian packages
      if: matrix.arch == 'amd64'
      run: mv -f ../*.deb . 2>/dev/null || true

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: debian-package-${{matrix.arch}}
        path: "*.deb"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: debian-package-*
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
      with:
        files: "*.deb"

