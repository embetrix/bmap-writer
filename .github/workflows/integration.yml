name: integration

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernel_crypto: ["OFF", "ON"]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get --no-install-recommends install -y bmap-tools libssl-dev libtinyxml2-dev libarchive-dev libkcapi-dev tar bzip2 gzip lz4 lzop xz-utils zstd python3 wget cppcheck

    - name: Cppcheck
      run: cppcheck --enable=all --suppress=missingIncludeSystem -Isrc src/

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DUSE_KERNEL_CRYPTO_API=${{matrix.kernel_crypto}}

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: build
      run: ctest -V -C ${{env.BUILD_TYPE}}

  static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernel_crypto: ["OFF", "ON"]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get --no-install-recommends install -y libarchive-dev libkcapi-dev pkg-config bmap-tools libssl-dev tar bzip2 gzip lz4 lzop xz-utils zstd python3 wget

    - name: Build tinyxml2 static library
      run: |
        git clone --depth 1 --branch 10.0.0 https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
        cmake -B /tmp/tinyxml2/build -S /tmp/tinyxml2 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -Dtinyxml2_BUILD_TESTING=OFF
        cmake --build /tmp/tinyxml2/build
        sudo cmake --install /tmp/tinyxml2/build

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_STATIC=ON -DUSE_KERNEL_CRYPTO_API=${{matrix.kernel_crypto}}

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Verify static binary
      run: |
        file build/bmap-writer
        ldd build/bmap-writer 2>&1 | grep -q 'not a dynamic executable'

    - name: Test
      working-directory: build
      run: ctest -V -C ${{env.BUILD_TYPE}}

  deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            run_on_arch: false
          - arch: arm64
            run_on_arch: aarch64
          - arch: armhf
            run_on_arch: armv7
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build Debian package (amd64)
      if: matrix.arch == 'amd64'
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y build-essential debhelper cmake pkg-config libtinyxml2-dev libarchive-dev libkcapi-dev
        VERSION=$(git describe --tags | sed 's/^v//')
        sed -i "1s/([^)]*)/(${VERSION})/" debian/changelog
        dpkg-buildpackage -us -uc -b

    - name: Build Debian package (${{matrix.arch}})
      if: matrix.arch != 'amd64'
      uses: uraimo/run-on-arch-action@d94c13912ea685de38fccc1109385b83fd79427d # v3.0.1
      with:
        arch: ${{matrix.run_on_arch}}
        distro: ubuntu_latest
        githubToken: ${{github.token}}
        install: |
          apt-get update
          apt-get --no-install-recommends install -y build-essential debhelper cmake pkg-config libtinyxml2-dev libarchive-dev libkcapi-dev git
        run: |
          git config --global --add safe.directory /home/runner/work/bmap-writer/bmap-writer
          VERSION=$(git describe --tags | sed 's/^v//')
          sed -i "1s/([^)]*)/(${VERSION})/" debian/changelog
          dpkg-buildpackage -us -uc -b
          mv -f ../*.deb .

    - name: Move Debian packages
      if: matrix.arch == 'amd64'
      run: mv -f ../*.deb . 2>/dev/null || true

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: debian-package-${{matrix.arch}}
        path: "*.deb"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, deb, static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: debian-package-*
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
      with:
        files: "*.deb"

